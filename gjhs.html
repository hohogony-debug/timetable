:root{
  --blue:#6E8A5B; --blue-deep:#4E6B3B; --blue-light:#E8EFDD; --blue-line:#CFDDBF;
  --dash:var(--dash); --cellbg:var(--cellbg); --cellbd:var(--cellbd); --freebg:var(--freebg); --freebd:var(--freebd);
  --emptybd:var(--emptybd); --panel:var(--panel); --zebra:var(--zebra); --tint:110,138,91;
  --ink:#10192B; --gray:#5B6479; --white:#fff;
}
body.theme-blue{
  --blue:#1C60EF; --blue-deep:#1247B8; --blue-light:#DBE8FE; --blue-line:#C3D9FC;
  --dash:#AFC8F2; --cellbg:#F7FAFF; --cellbd:#E8F0FE; --freebg:#FAFBFC; --freebd:#EEF1F5;
  --emptybd:#EBF1FB; --panel:#FCFDFF; --zebra:#F4F8FF; --tint:28,96,239;
}
body.theme-white{
  --blue:#454B54; --blue-deep:#23272E; --blue-light:#EDEFF1; --blue-line:#D6DADF;
  --dash:#C4CAD1; --cellbg:#FAFAFB; --cellbd:#EDEFF1; --freebg:#FAFAFA; --freebd:#F0F1F3;
  --emptybd:#F1F3F5; --panel:#FCFCFD; --zebra:#F5F6F7; --tint:69,75,84;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Paperlogy','Pretendard','Malgun Gothic','맑은 고딕',sans-serif;
  font-weight:700; color:var(--ink);
  background:linear-gradient(135deg,#fff 0%,#fff 38%,var(--blue-light) 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  padding:28px 20px 60px;
}

/* ---------- controls ---------- */
.bar{max-width:920px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  background:rgba(255,255,255,.82);backdrop-filter:blur(6px);
  border:1.5px solid var(--blue-line);border-radius:16px;padding:14px 16px;
  box-shadow:0 6px 20px rgba(var(--tint),.08)}
.brandmini{font-size:13px;font-weight:900;color:var(--blue-deep);letter-spacing:-.02em;margin-right:4px}
.seg{display:flex;background:var(--blue-light);border-radius:10px;padding:3px;gap:2px}
.seg button{font-family:inherit;font-weight:800;font-size:14px;border:0;background:transparent;color:var(--blue-deep);
  padding:8px 18px;border-radius:8px;cursor:pointer;transition:.15s}
.tseg button{padding:8px 13px;font-size:13px}
.seg button.on{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(var(--tint),.35)}
select,input[type=search]{font-family:inherit;font-weight:800;font-size:15px;color:var(--ink);
  border:1.5px solid var(--blue-line);background:#fff;border-radius:10px;padding:9px 13px;outline:none;transition:.15s}
select:focus,input[type=search]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(var(--tint),.15)}
select{min-width:150px;cursor:pointer}
input[type=search]{width:130px}
.spacer{flex:1}
.btn{font-family:inherit;font-weight:800;font-size:14px;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;transition:.15s;
  background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(var(--tint),.3)}
.btn:hover{background:var(--blue-deep)}
.btn.ghost{background:#fff;color:var(--blue-deep);border:1.5px solid var(--blue-line);box-shadow:none}
.btn.ghost:hover{background:var(--blue-light)}
.nav{display:flex;gap:4px}
.nav button{font-family:inherit;font-weight:900;font-size:16px;width:38px;height:38px;border-radius:10px;
  border:1.5px solid var(--blue-line);background:#fff;color:var(--blue-deep);cursor:pointer;transition:.15s}
.nav button:hover{background:var(--blue-light)}
.hint{max-width:920px;margin:0 auto 20px;font-size:12.5px;font-weight:700;color:var(--gray);text-align:center;line-height:1.6}

/* ---------- sheet ---------- */
.stack{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.sheet{background:#fff;border:1.5px solid var(--blue-line);border-radius:20px;padding:30px 30px 26px;
  box-shadow:0 10px 34px rgba(16,25,43,.09)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding-bottom:16px;margin-bottom:18px;border-bottom:2.5px solid var(--blue-light);position:relative}
.head::after{content:"";position:absolute;left:0;bottom:-2.5px;width:78px;height:2.5px;background:var(--blue)}
.eyebrow{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.06em;margin-bottom:7px}
.who{font-size:30px;font-weight:900;letter-spacing:-.035em;line-height:1.1}
.who small{font-size:17px;font-weight:800;color:var(--gray);margin-left:7px;letter-spacing:-.02em}
.tags{display:flex;gap:7px;flex-shrink:0;padding-bottom:3px}
.tag{background:var(--blue-light);color:var(--blue-deep);font-size:12.5px;font-weight:800;
  padding:7px 13px;border-radius:20px;white-space:nowrap}
.tag b{font-weight:900;font-size:14px;margin-left:3px}
.tag.solid{background:var(--blue);color:#fff}

table{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
th{font-size:25px;font-weight:900;color:#fff;background:var(--blue);padding:14px 0;border-radius:9px;letter-spacing:-.01em}
th.corner{background:var(--blue-deep)}
td.per{font-size:24px;font-weight:900;color:var(--blue-deep);background:var(--blue-light);
  border-radius:9px;text-align:center;width:70px}
td.cell{background:var(--cellbg);border:1.4px solid var(--cellbd);border-radius:9px;height:88px;text-align:center;
  padding:5px 3px;vertical-align:middle}
td.cell.has{background:hsl(var(--h) var(--s) var(--l));border-color:hsl(var(--h) 46% calc(var(--l) - 11%))}
td.cell.free{background:var(--freebg);border-color:var(--freebd)}
td.cell.empty{background:var(--cellbg);border-color:var(--emptybd)}

.foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;

/* ---------- 보강·교체 찾기 ---------- */
.finder{max-width:920px;margin:0 auto;display:none;flex-direction:column;gap:18px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col h4{font-size:14px;font-weight:900;color:var(--blue-deep);margin-bottom:8px;

.fctrl input[type=date],.gtools input{font-family:inherit;font-weight:800;font-size:15px;color:var(--ink);

.mcard{border:1.5px solid var(--blue-line);border-radius:14px;padding:12px 14px;background:var(--panel)}

.cards{display:grid;grid-template-columns:repeat(2,98mm);gap:1mm;justify-content:center}

  border:0.3mm dashed var(--dash);border-radius:2mm;display:flex;flex-direction:column}

function tint(subject, extra){

    const m = /^(\d)\s*-\s*(\d)/.exec(extra || '');

      const g = +m[1];
      return { h: (CLASS_HUE[(+m[2] - 1) % 8] + (GRADE_H[g] || 0) + 360) % 360,

    }
  } else {
    const h = AREA[(subject || '').trim()];

  }
  return null;
}

              (extra ? `<div class="chip${extra.includes('·')?' multi':''}">${esc(extra)}</div>` : '') + '</td>';
    }
    rows += '</tr>';
  }
  return `<table>${head}${rows}</table>`;
}

function fillSelect(){
  const q = el('q').value.trim();
  const items = list();
  const sel = el('sel');
  sel.innerHTML = '';

    if(q && !it.n.includes(q)) return;

    const o = document.createElement('option');
    o.textContent = '결과 없음'; o.disabled = true; sel.appendChild(o);
    return;
  }
  const has = [...sel.options].some(o => +o.value === cur);
  if(!has) cur = +sel.options[0].value;
  sel.value = cur;
}

/* 그 교시를 맡았다고 가정했을 때 만들어지는 '연속 수업' 블록 길이 */
function runLen(t,di,pi){
  let n=1;
  for(let k=pi-1;k>=0&&busy(t,di,k);k--)n++;
  for(let k=pi+1;k<7&&busy(t,di,k);k++)n++;
  return n;
}
const tri=(t,di,pi)=>runLen(t,di,pi)>=3;   // 3연강 이상

function candRow(t,di,pi,extra,warn,pk){
  const g=SUBJ[t.n]||'미분류', dt=DETAIL[t.n];
  return `<div class="cand${pk?' pk'+(isPicked(pi,pk)?' picked':''):''}"${pk?pkAttr(pi,pk):''}><span class="nm" data-tt="${esc(t.n)}" data-di="${di}" data-pi="${pi}">${esc(t.n)}</span>`+
    `<span class="sj">${dt&&dt!==g?g+'·'+dt:g}</span>`+
    (EXT[t.n]?`<span class="ext">내선 ${EXT[t.n]}</span>`:'')+
    (extra||'')+(warn||'')+
    `<span class="ld">그날 ${dayLoad(t,di)}시간</span></div>`;
}

let curPi=-1;

function lessonHTML(A,di,pi){
  const T=DATA.teachers, dn=DATA.days[di], myG=SUBJ[A.n]||'미분류';
  let html='';
  {
    const c=(A.g[di]&&A.g[di][pi])||['',''];
    const s=(c[0]||'').trim(), cl=(c[1]||'').trim();
    if(!s) return '';
    if(!cl || cl.includes('·')){
      return `<div class="lesson"><div class="lhead"><span class="pbadge">${pi+1}교시</span>`+
            `<span class="lsub">${esc(s)}</span><span class="lnote">학급 배정 수업이 아니라 보강·교체 검색 대상에서 제외했어요.</span></div></div>`;
    }
    const free=T.filter(B=>B!==A&&!busy(B,di,pi));
    const rank=(a,b)=>runLen(a,di,pi)-runLen(b,di,pi)||dayLoad(a,di)-dayLoad(b,di);
    const same=free.filter(B=>(SUBJ[B.n]||'미분류')===myG&&myG!=='미분류').sort(rank);
    const restByG={};
    free.filter(B=>!same.includes(B)).forEach(B=>{
      const g=SUBJ[B.n]||'미분류';(restByG[g]=restByG[g]||[]).push(B);});
    const swaps=[];
    T.forEach(B=>{
      if(B===A||busy(B,di,pi))return;
      for(let dj=0;dj<5;dj++)for(let pj=0;pj<7;pj++){
        if(dj===di&&pj===pi)continue;
        const bc=(B.g[dj]&&B.g[dj][pj])||['',''];
        if((bc[1]||'').trim()===cl&&!busy(A,dj,pj))
          swaps.push({B,dj,pj,s:bc[0].trim(),
            bRun:runLen(B,di,pi),aRun:runLen(A,dj,pj)});
      }
    });
    swaps.sort((a,b)=>((a.bRun>=3)+(a.aRun>=3))-((b.bRun>=3)+(b.aRun>=3))
      ||(a.bRun+a.aRun)-(b.bRun+b.aRun)||a.dj-b.dj||a.pj-b.pj);
    html+=`<div class="lesson"><div class="lhead"><span class="pbadge">${pi+1}교시</span>`+
          `<span class="lsub">${esc(s)}</span><span class="lcls">${esc(cl)}</span></div><div class="cols">`;
    html+=`<div class="col"><h4>보강 후보 <span style="font-weight:800;color:var(--gray);font-size:12px">— 이 시간이 빈 선생님</span></h4>`;
    html+=`<h5>동일 교과 (${myG})</h5>`;
    html+=same.length?same.map(B=>candRow(B,di,pi,'',
        tri(B,di,pi)?`<span class="warn">${runLen(B,di,pi)}연강</span>`:'',{k:'b',n:B.n})).join('')
      :`<div class="nores">동일 교과 중 이 시간이 빈 선생님이 없어요.</div>`;
    html+=`<h5>전체</h5>`;
    const gk=GROUPS.filter(g=>restByG[g]);
    html+=gk.length?gk.map(g=>`<div class="cand"><span class="sj">${g}</span><span>`+
      restByG[g].sort(rank)
        .map(B=>`<span class="tnm pk${isPicked(pi,{k:'b',n:B.n})?' picked':''}"${pkAttr(pi,{k:'b',n:B.n})} data-tt="${esc(B.n)}" data-di="${di}">${esc(B.n)}`+
          `(${EXT[B.n]?EXT[B.n]+'·':''}${dayLoad(B,di)}시간${tri(B,di,pi)?'·'+runLen(B,di,pi)+'연강':''})</span>`).join(' · ')+`</span></div>`).join('')
      :`<div class="nores">이 시간이 빈 선생님이 없어요.</div>`;
    html+=`</div><div class="col"><h4>교체 후보 <span style="font-weight:800;color:var(--gray);font-size:12px">— ${esc(cl)} 다른 수업과 맞바꾸기</span></h4>`;
    html+=swaps.length?swaps.map(x=>candRow(x.B,di,pi,
      `<span class="sw">${dn}${pi+1} ↔ ${DATA.days[x.dj]}${x.pj+1} (${esc(x.s)})</span>`,
      (x.bRun>=3?`<span class="warn">상대 ${x.bRun}연강</span>`:'')+(x.aRun>=3?`<span class="warn">내 ${x.aRun}연강</span>`:''),
      {k:'s',n:x.B.n,dj:x.dj,pj:x.pj,s:x.s})).join('')
      :`<div class="nores">조건에 맞는 교체 상대가 없어요. (상대가 이 시간에 비고, 선생님이 상대 시간에 비어야 해요)</div>`;
    html+=`</div></div></div>`;
  }
  return html;
}

    (getPick(x.pi)?`<em>→ ${esc(getPick(x.pi).n)}${getPick(x.pi).k==='s'?' (교체)':''}</em>`:'')+`</button>`).join('')+`</div>`;
  html+=`<div id="fbody"></div>`;
  html+=`<div class="lnote" style="margin-top:14px">위에서 <b>교시를 누르면</b> 그 시간의 후보가 나와요. <b>후보를 누르면</b> 아래 결보강 계획서에 들어가요(다시 누르면 빠짐). 후보는 <b>연속 수업이 적게 생기는 분 → 그날 수업이 적은 분</b> 순으로 정렬됩니다. '3연강'은 이 시간을 맡으면 3시간 이상 내리 수업하게 된다는 표시예요(2연강은 표시하지 않습니다). 전체 목록의 괄호는 (내선·그날 시수). <b>이름에 마우스를 올리면</b> 그분의 주간 시간표가 작게 떠요.</div>`;
  el('fout').innerHTML=html;
  el('fchips').querySelectorAll('.pchip').forEach(b=>
    b.onclick=()=>showPeriod(+b.dataset.pi));
  const keep=list.some(x=>x.pi===curPi)?curPi:list[0].pi;
  showPeriod(keep);
  renderPlan();
}

/* ================= 결보강 계획서 ================= */
const WD=['일','월','화','수','목','금','토'];
const plan={t:null,reason:'',days:{},from:'',to:''};   // from~to: 여러 날 결강 기간   // days['2026-10-15'][pi] = {k:'b'|'s', n, dj, pj, s}
let lastDate='';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseISO=v=>{const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d);};
const md=v=>{const d=parseISO(v);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;};
function weekDate(v,dj){const d=parseISO(v);d.setDate(d.getDate()-(d.getDay()-1)+dj);return iso(d);}
/* 교체 수업 날짜: 같은 주 그 요일, 이미 지난 날이거나 결강 기간 안이면 다음 주로 */
function swapDate(v,dj){
  const d=parseISO(weekDate(v,dj)),t=new Date();t.setHours(0,0,0,0);
  const off=new Set([...Object.keys(plan.days).filter(k=>Object.keys(plan.days[k]).length),curDate(),...rangeDates()]);
  while(d<t||off.has(iso(d)))d.setDate(d.getDate()+7);
  return iso(d);
}
const curDate=()=>el('fDate').value;
const getPick=pi=>(plan.days[curDate()]||{})[pi];
const pickCount=()=>Object.values(plan.days).reduce((a,d)=>a+Object.keys(d).length,0);
const sameP=(a,b)=>!!(a&&b&&a.k===b.k&&a.n===b.n&&(a.k==='b'||(a.dj===b.dj&&a.pj===b.pj)));
const isPicked=(pi,p)=>sameP(getPick(pi),p);
function pkAttr(pi,p){
  return ` data-pk="${p.k}" data-pi="${pi}" data-n="${esc(p.n)}"`+
    (p.k==='s'?` data-dj="${p.dj}" data-pj="${p.pj}" data-s="${esc(p.s)}"`:'');
}
const inRange=ds=>!!plan.to&&ds>=plan.from&&ds<=plan.to;
function rangeDates(){
  const out=[]; if(!plan.to) return out;
  for(const d=parseISO(plan.from),e=parseISO(plan.to);d<=e;d.setDate(d.getDate()+1)) if(d.getDay()%6) out.push(iso(d));
  return out;
}
el('fEnd').onchange=()=>{
  const v=el('fEnd').value;
  if(!v){plan.from=plan.to='';renderPlan();return;}
  const from=inRange(curDate())?plan.from:curDate();
  if(v<from){alert('끝나는 날이 시작하는 날보다 빨라요.');el('fEnd').value=plan.to;return;}
  plan.from=from; plan.to=v; renderPlan();
};
function dateMoved(){
  lastDate=curDate();
  if(plan.to&&!inRange(curDate())){plan.from=plan.to='';el('fEnd').value='';}
  Object.keys(plan.days).forEach(k=>{if(!Object.keys(plan.days[k]).length)delete plan.days[k];});
  renderFinder();
}
el('fout').addEventListener('click',e=>{
  const b=e.target.closest('[data-pk]'); if(!b) return;
  const pi=+b.dataset.pi, ds=b.dataset;
  const p=ds.pk==='s'?{k:'s',n:ds.n,dj:+ds.dj,pj:+ds.pj,s:ds.s}:{k:'b',n:ds.n};
  const day=plan.days[curDate()]=plan.days[curDate()]||{};
  if(sameP(day[pi],p)){ delete day[pi]; }
  else{
    day[pi]=p;
    /* 아직 안 정한 다음 교시로 넘어가기 */
    const A=DATA.teachers[+el('fT').value], di=+el('fD').value;
    let moved=false;
    for(let k of [...Array(7).keys()].filter(k=>k>pi).concat([...Array(pi).keys()])){
      const c=(A.g[di]&&A.g[di][k])||['',''];
      const cl=(c[1]||'').trim();
      if((c[0]||'').trim()&&cl&&!cl.includes('·')&&!day[k]){curPi=k;moved=true;break;}
    }
    /* 그날을 다 정했으면 기간 안의 다음 날로 */
    const nx=moved?null:rangeDates().find(x=>x>curDate());
    if(nx){el('fDate').value=lastDate=nx; el('fD').value=parseISO(nx).getDay()-1; curPi=-1;}
  }
  renderFinder();
});

function planRows(){
  const A=DATA.teachers[+el('fT').value], rows=[];
  const dates=new Set(Object.keys(plan.days).filter(k=>Object.keys(plan.days[k]).length));
  dates.add(curDate()); rangeDates().forEach(x=>dates.add(x));
  [...dates].sort().forEach(ds=>{
    const di=parseISO(ds).getDay()-1;
    for(let pi=0;pi<7;pi++){
      const c=(A.g[di]&&A.g[di][pi])||['',''];
      const s=(c[0]||'').trim(), cl=(c[1]||'').trim();
      if(s&&cl) rows.push({ds,pi,s,cl,p:(plan.days[ds]||{})[pi]});
    }
  });
  return {A,rows,dates:[...dates].sort()};
}

/* ---- 쿨메신저 확인 메시지: 도와주시는 선생님마다 한 통 ---- */
const josa=(w,a,b,rl=true)=>{const c=(w||'').charCodeAt(w.length-1)-0xAC00;if(c<0||c>11171)return w+a;const j=c%28;return w+(j&&!(rl&&j===8)?a:b);};
/* 전체(단체) 메시지: 모든 결강 수업과 맡은 선생님을 한 통에 */
function allMsgCard(A,items){
  if(!items.length) return '';
  const rsn=plan.reason.trim(), ds0=items[0].ds, ds1=items[items.length-1].ds;
  const anySw=items.some(r=>r.p.k==='s'), anyBo=items.some(r=>r.p.k==='b');
  const what=anyBo&&anySw?'보강·교체를':anyBo?'보강을':'수업 교체를';
  const L=[`안녕하세요. ${A.n}입니다.`,
    `${md(ds0)}${ds1!==ds0?' ~ '+md(ds1):''} ${rsn?josa(rsn,'으로','로')+' ':''}수업을 비우게 되어 아래와 같이 ${what} 부탁드립니다.`];
  let last='';
  items.forEach(r=>{
    if(r.ds!==last){L.push('',`■ ${md(r.ds)}`);last=r.ds;}
    L.push(r.p.k==='s'
      ? `· ${r.pi+1}교시 ${r.cl} ${r.s} → ${r.p.n} 선생님 (교체: ${md(swapDate(r.ds,r.p.dj))} ${r.p.pj+1}교시 ${josa(r.p.s,'은','는',false)} 제가 들어갑니다)`
      : `· ${r.pi+1}교시 ${r.cl} ${r.s} → ${r.p.n} 선생님 (보강)`);
  });
  L.push('','도와주셔서 감사합니다. 확인 부탁드립니다.');
  const t=L.join('\n'), rows=L.reduce((k,x)=>k+Math.max(1,Math.ceil(x.length/70)),0)+1;
  return `<div class="mcard mall"><div class="mhead"><b>전체 메시지</b><span>여러 선생님께 한 번에 보낼 때</span><button class="btn mcopy">복사</button></div>`+
    `<textarea rows="${rows}">${esc(t)}</textarea></div>`;
}
function msgHTML(A,rows){
  const by={};
  rows.forEach(r=>{if(r.p)(by[r.p.n]=by[r.p.n]||[]).push(r);});
  const names=Object.keys(by);
  if(!names.length) return '';
  const cards=names.map(n=>{
    const list=by[n], bo=list.filter(r=>r.p.k==='b'), sw=list.filter(r=>r.p.k==='s');
    const what=bo.length&&sw.length?'보강·교체를':bo.length?'보강을':'교체를';
    const rsn=plan.reason.trim();
    const L=[`${n} 선생님, 안녕하세요. ${A.n}입니다.`,
      `${rsn?josa(rsn,'으로','로')+' ':''}수업을 비우게 되어 아래와 같이 ${what} 부탁드립니다.`];
    if(bo.length) L.push('','▶ 보강',...bo.map(r=>`· ${md(r.ds)} ${r.pi+1}교시 ${r.cl} ${r.s}`));
    if(sw.length) L.push('','▶ 교체',...sw.flatMap(r=>{const d2=swapDate(r.ds,r.p.dj);
      return [`· ${md(r.ds)} ${r.pi+1}교시 ${r.cl} → 선생님께서 수업해 주시고`,
              `  ${md(d2)} ${r.p.pj+1}교시 ${r.cl} (${r.p.s}) → 제가 들어가겠습니다.`];}));
    L.push('','확인 부탁드립니다. 감사합니다.');
    const t=L.join('\n'), lines=L.reduce((k,x)=>k+Math.max(1,Math.ceil(x.length/34)),0)+1;
    return `<div class="mcard"><div class="mhead"><b>${esc(n)}</b> 선생님께`+
      `${EXT[n]?`<span>내선 ${EXT[n]}</span>`:''}<button class="btn mcopy">복사</button></div>`+
      `<textarea rows="${lines}">${esc(t)}</textarea></div>`;
  }).join('');
  return `<div class="msgs"><div class="ftitle">쿨메신저 확인 메시지<small>전체로 보내거나 선생님별로 복사해서 보내세요</small></div><div class="mgrid">${allMsgCard(A,rows.filter(r=>r.p))}${cards}</div></div>`;
}

function renderPlan(){
  const {A,rows,dates}=planRows();
  const d0=parseISO(dates[0]), d1=parseISO(dates[dates.length-1]);
  const period=`${d0.getFullYear()}년 ${d0.getMonth()+1}월 ${d0.getDate()}일 ~ ${d1.getMonth()+1}월 ${d1.getDate()}일`;
  const N=Math.max(17,rows.length), rh=Math.min(7.9,134.3/N);
  const td=(v,c)=>`<td contenteditable${c?` class="${c}"`:''}>${v||''}</td>`;
  let body='';
  for(let i=0;i<N;i++){
    const r=rows[i];
    if(!r){ body+='<tr>'+td()+td()+td()+td()+td('','x')+td()+td()+td()+td()+td()+'</tr>'; continue; }
    const p=r.p, sw=p&&p.k==='s'?`${md(swapDate(r.ds,p.dj))} ${p.pj+1}교시`:'';
    body+='<tr>'+td(md(r.ds))+td(r.pi+1)+td(esc(r.s),r.s.length>5?'sm':'')+td(esc(r.cl),r.cl.length>5?'sm':'')+
      td(p?esc(p.n):'','x')+td()+td(sw,'sm')+td()+td()+td(p&&p.k==='s'?'교체':'')+'</tr>';
  }
  const chips=dates.map(ds=>`<button class="dchip${ds===curDate()?' cur':''}" data-ds="${ds}">${md(ds)}`+
    `${ds===curDate()||inRange(ds)?'':' <span class="dx">✕</span>'}</button>`).join('');
  el('gpanel').innerHTML=`<div class="gtools">
      <span class="ftitle">결보강 계획서</span>
      <label style="margin-left:6px">결강사유</label><input id="gRsn" list="rsnList" value="${esc(plan.reason)}" placeholder="출장">
      <datalist id="rsnList"><option>출장</option><option>연가</option><option>병가</option><option>공가</option><option>조퇴</option><option>연수</option></datalist>
      <span style="display:flex;gap:6px;flex-wrap:wrap">${chips}</span>
      <span class="spacer"></span>
      <button class="btn" id="gPrint">계획서 인쇄</button>
    </div>
    <div class="gpaper"><div class="gf">
      <div class="t">수업 보강 계획서</div>
      <div class="info">
        <div>결강교사 : <span class="tn" contenteditable>${esc(A.n)}</span> (인)</div>
        <div>결강사유 : [ <span id="gReason" contenteditable>${esc(plan.reason)||'&nbsp;&nbsp;&nbsp;'}</span> ]</div>
        <div contenteditable>결강기간 : ${period}</div>
      </div>
      <table class="ap"><tr><td class="k" rowspan="2">결<br>재</td><td>담당계</td><td>부 &nbsp;장</td><td>교 &nbsp;감</td></tr>
        <tr><td></td><td></td><td></td></tr></table>
      <div class="main">
        <table class="g">
          <colgroup><col style="width:19mm"><col style="width:11.5mm"><col style="width:23.5mm"><col style="width:16.5mm">
            <col style="width:18.7mm"><col style="width:11.7mm"><col style="width:22.5mm"><col style="width:19.1mm"><col style="width:11.2mm"><col style="width:14.3mm"></colgroup>
          <thead>
            <tr><th colspan="4">결 강 &nbsp; 수 업</th><th colspan="3" class="x" style="letter-spacing:.1em">보 강(교체) 수업</th><th colspan="2">추 후 보 강</th><th rowspan="2" style="letter-spacing:0">비고</th></tr>
            <tr><th>날짜<small>(요일)</small></th><th>교시</th><th>과목</th><th>학년 반</th>
              <th class="x">보강<small>(교체)</small><br>교사</th><th>서명</th><th>날짜·교시<span class="s7">(교체인 경우)</span></th>
              <th>날짜<small>(요일)</small></th><th>교시</th></tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
        <div class="note"><span>* 유의사항 :</span><span>수업은 교체가 원칙이나 어려울 때에는 다른 교사로 보강조치하시기 바랍니다.</span>
          <span></span><span>보강교사의 수업이 중복되지 않게 확인하십시오.</span>
          <span></span><span>교체 수업 하루 전 종례 이전에 해당 학반에 예고하시기 바랍니다.</span></div>
      </div>
      <div class="sch">광양제철고등학교</div>
    </div></div>${msgHTML(A,rows)}`;
  if(rh<7.9) el('gpanel').querySelectorAll('tbody td').forEach(c=>c.style.height=rh+'mm');
  el('gRsn').oninput=()=>{plan.reason=el('gRsn').value;el('gReason').innerHTML=esc(plan.reason)||'&nbsp;&nbsp;&nbsp;';};
  el('gPrint').onclick=()=>window.print();
  el('gpanel').querySelectorAll('.mcard textarea').forEach(t=>{t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px';});
  el('gpanel').querySelectorAll('.mcopy').forEach(b=>b.onclick=()=>{
    const ta=b.closest('.mcard').querySelector('textarea');
    const done=()=>{b.textContent='복사됨 ✓';setTimeout(()=>b.textContent='복사',1500);};
    if(navigator.clipboard&&window.isSecureContext!==false)
      navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();document.execCommand('copy');done();});
    else{ta.select();document.execCommand('copy');done();}
  });
  el('gpanel').querySelectorAll('.dchip').forEach(b=>b.onclick=e=>{
    const ds=b.dataset.ds;
    if(ds===curDate()) return;
    if(e.target.classList.contains('dx')){
      if(confirm(`${md(ds)} 결강을 계획서에서 뺄까요?`)){ delete plan.days[ds]; renderPlan(); }
      return;
    }
    el('fDate').value=ds; el('fD').value=parseISO(ds).getDay()-1; dateMoved();
  });
}

/* ---- 후보 이름 마우스오버: 미니 주간 시간표 툴팁 ---- */
const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
const tmap={}; DATA.teachers.forEach(t=>tmap[t.n]=t);

function miniTT(name, hdi, hpi){
  const t=tmap[name]; if(!t) return '';
  let h=`<div class="th">${esc(name)}<small>${EXT[name]?'내선 '+EXT[name]:''}</small></div><table>`;
  h+='<tr><td></td>'+DATA.days.map(d=>`<th>${d}</th>`).join('')+'</tr>';
  for(let p=0;p<7;p++){
    h+=`<tr><td class="p">${p+1}</td>`;
    for(let d=0;d<5;d++){
      const c=(t.g[d]&&t.g[d][p])||['',''];
      const s=(c[0]||'').trim(), cl=(c[1]||'').trim();
      const hl=(d===hdi&&p===hpi)?' hl':'';
      h+=`<td class="c${s?' b':''}${hl}">${s?esc(s)+(cl?'<br>'+esc(cl.split(' · ')[0]):''):''}</td>`;
    }
    h+='</tr>';
  }
  return h+'</table>';
}
function moveTip(e){
  const w=tip.offsetWidth,hh=tip.offsetHeight;
  let x=e.clientX+16,y=e.clientY+14;
  if(x+w>innerWidth-8)x=e.clientX-w-16;
  if(y+hh>innerHeight-8)y=Math.max(8,e.clientY-hh-14);
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
document.addEventListener('mouseover',e=>{
  const n=e.target.closest('[data-tt]');
  if(!n){tip.style.display='none';return;}
  tip.innerHTML=miniTT(n.dataset.tt,+n.dataset.di,+n.dataset.pi);
  tip.style.display='block'; moveTip(e);
});
document.addEventListener('mousemove',e=>{
  if(tip.style.display==='block')moveTip(e);
});

fillFinder();
fillSelect(); render();
setView(true);
</script>
</body>
</html>
